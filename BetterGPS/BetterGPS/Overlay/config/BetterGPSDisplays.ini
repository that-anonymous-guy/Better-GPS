; BetterGPS display registry. Reloaded when ATS starts.
; IDs: letters/digits/_/-. ui_path: absolute ATS virtual path.
; Ctrl+F9 saves independent adjustments in display-settings/<id>.cfg.
; vertical and F150 horizontal are available. horizontal_4_3 is reserved.
; Disabled or unavailable layouts retain the native interface after restart.
[display.road_trip_phone]
name=Windshield phone
enabled=true
ui_path=/ui/dashboard/rt_phone_gps.sii
layout=vertical

[display.cabin_phone]
name=Cabin Accessories phone
enabled=true
ui_path=/ui/dashboard/cellphone_gps.dlc_toys.sii
layout=vertical

; Example for a modder (uncomment and enter your actual path):
; [display.my_phone]
; name=My mod phone
; enabled=true
; ui_path=/ui/dashboard/my_mod_phone.sii
; layout=vertical

; Separate physical console phone; shares the native Road Trip map producer.
[display.road_trip_console]
name=Center console phone
enabled=true
source_display=road_trip_phone
layout=vertical
vehicles=ford.mustang_67,ford.f150_23,ford.victoria_06,ford.bronco_24

; Optional vehicles= list on any display: exact SDK IDs, prefix*, or @trucks.
; Without a list, custom displays appear only after their marker is detected.

[display.f150_infotainment]
name=F150 infotainment
enabled=true
ui_path=/ui/dashboard/ford_f150_gps_23.sii
layout=horizontal
vehicles=ford.f150_23

[display.bronco_infotainment]
name=Bronco infotainment
enabled=true
ui_path=/ui/dashboard/ford_bronco_gps_24.sii
layout=horizontal
vehicles=ford.bronco_24
