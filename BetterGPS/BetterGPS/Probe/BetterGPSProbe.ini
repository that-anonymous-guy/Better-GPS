[probe]
; Live 0.3.0, protocol v2: ATS 1.61.x x64 only. The version guard cannot be disabled.
allow_unsupported_game_version=0

; How often the frame_end callback actually samples GPS memory.
poll_interval_ms=250

; How often a human-readable STATE line is written to BetterGPSProbe.log.
state_log_interval_ms=1000

; Hard sanity limit for SCS route arrays. Invalid values are rejected rather than dereferenced.
max_route_items=20000

; Legacy CSV capture is disabled in live mode. MapBridge records the received messages.
snapshot_on_route_change=0

; Extra initialization / address diagnostics.
verbose=1
